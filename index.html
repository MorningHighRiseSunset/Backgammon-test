        .dice-face::before {

            height: 16px;

    <script type="text/javascript" charset="utf-8">

    <script>
        // Backgammon tips and hints array
        const tips = [
            "💡 Try to make points in sequence to build a prime",
            "⚠️ Don't leave single checkers exposed - they can be hit!",
            "🎯 The 5 and 6 points are key defensive positions",
            "✉️ Found a bug or have suggestions? Email maurice13stu@gmail.com",
            "🎲 Early in the game, try to occupy your opponent's 5-point",
            "⚡ Don't rush to bear off if you have vulnerable checkers",
            "🌟 The best opening roll in backgammon is 3-1",
            "🛡️ Try to maintain at least two checkers on each point",
            "🔥 Running game or blocking game? Choose based on your position",
            "📧 Contact maurice13stu@gmail.com with any feedback!",
            "🎮 Control the center points (8, 13, and 12) when possible",
            "💪 Building a prime of 6 consecutive points is a strong strategy",
            "🎯 The bar point (7) is a crucial defensive position",
            "🔄 Always look for opportunities to hit opponent's blots",
            "🎲 When bearing off, try to maintain an even distribution"
        ];

        let previousTipIndex = -1;

        function getRandomTip() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * tips.length);
            } while (newIndex === previousTipIndex);
            
            previousTipIndex = newIndex;
            return tips[newIndex];
        }

        function showHint(customMessage) {
            const hintPopup = document.getElementById('hint-popup');
            const message = customMessage || getRandomTip();
            hintPopup.textContent = message;
            hintPopup.classList.add('show');

            setTimeout(() => {
                hintPopup.classList.remove('show');
            }, 5000); // Show for 5 seconds
        }

        // Show first hint after 5 seconds
        setTimeout(showHint, 5000);
        
        // Show new hint every 15 seconds
        setInterval(showHint, 15000);

        // 3D Dice with Three.js
        let dice1Scene, dice2Scene, dice1Camera, dice2Camera, dice1Renderer, dice2Renderer;
        let dice1Model, dice2Model;
        let dice1Loaded = false, dice2Loaded = false;

        function init3DDice() {
            // Initialize dice 1
            const dice1Container = document.getElementById('dice1-canvas');
            dice1Scene = new THREE.Scene();
            dice1Camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            dice1Renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            dice1Renderer.setSize(100, 100);
            dice1Container.appendChild(dice1Renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            dice1Scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            dice1Scene.add(directionalLight);

            // Load dice model
            const loader = new THREE.GLTFLoader();
            loader.load('Dice/dice.glb', function(gltf) {
                dice1Model = gltf.scene;
                dice1Model.scale.set(2, 2, 2);
                dice1Scene.add(dice1Model);
                dice1Camera.position.z = 3;
                dice1Loaded = true;
                animateDice1();
            }, undefined, function(error) {
                console.error('Error loading dice model:', error);
                // Fallback to CSS dice if GLB fails
                console.log('Falling back to CSS dice');
            });

            // Initialize dice 2
            const dice2Container = document.getElementById('dice2-canvas');
            dice2Scene = new THREE.Scene();
            dice2Camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            dice2Renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            dice2Renderer.setSize(100, 100);
            dice2Container.appendChild(dice2Renderer.domElement);

            // Lighting
            const ambientLight2 = new THREE.AmbientLight(0xffffff, 0.6);
            dice2Scene.add(ambientLight2);
            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight2.position.set(5, 5, 5);
            dice2Scene.add(directionalLight2);

            // Load dice model
            loader.load('Dice/dice.glb', function(gltf) {
                dice2Model = gltf.scene;
                dice2Model.scale.set(2, 2, 2);
                dice2Scene.add(dice2Model);
                dice2Camera.position.z = 3;
                dice2Loaded = true;
                animateDice2();
            }, undefined, function(error) {
                console.error('Error loading dice model:', error);
            });
        }

        function animateDice1() {
            requestAnimationFrame(animateDice1);
            if (dice1Model && dice1Renderer) {
                dice1Renderer.render(dice1Scene, dice1Camera);
            }
        }

        function animateDice2() {
            requestAnimationFrame(animateDice2);
            if (dice2Model && dice2Renderer) {
                dice2Renderer.render(dice2Scene, dice2Camera);
            }
        }

        function getDiceRotation(value) {
            // Map dice values to rotations - based on calibration data
            const rotations = {
                1: { x: Math.PI / 2, y: 0, z: 0 },  // Position 2 shows 1
                2: { x: 0, y: -Math.PI / 2, z: 0 }, // Position 5 shows 2
                3: { x: Math.PI, y: 0, z: 0 },      // Position 8 shows 3
                4: { x: 0, y: 0, z: 0 },           // Position 1 shows 4
                5: { x: 0, y: Math.PI / 2, z: 0 },  // Position 4 shows 5
                6: { x: -Math.PI / 2, y: 0, z: 0 }  // Position 3 shows 6
            };
            return rotations[value] || { x: 0, y: 0, z: 0 };
        }

        function animateDiceRoll(diceModel, targetRotation, duration = 1000) {
            const startRotation = { x: diceModel.rotation.x, y: diceModel.rotation.y, z: diceModel.rotation.z };
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing function
                const easeOut = 1 - Math.pow(1 - progress, 3);

                // Add some spinning during animation
                const spinX = Math.sin(progress * Math.PI * 4) * Math.PI * 2;
                const spinY = Math.cos(progress * Math.PI * 4) * Math.PI * 2;

                diceModel.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * easeOut + spinX * (1 - easeOut);
                diceModel.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * easeOut + spinY * (1 - easeOut);
                diceModel.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * easeOut;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Ensure final rotation is exact
                    diceModel.rotation.x = targetRotation.x;
                    diceModel.rotation.y = targetRotation.y;
                    diceModel.rotation.z = targetRotation.z;
                }
            }

            animate();
        }

        // Dice selection state
        let selectedDice = [];

        function update3DDice(diceValues) {
            const dice3dContainer = document.getElementById('dice3d-container');
            const cssDiceContainer = document.getElementById('cssDiceContainer');
            const diceValuesDisplay = document.getElementById('dice-values-display');

            // Reset selected dice when new dice are rolled
            selectedDice = [];

            if (diceValues && diceValues.length > 0) {
                // Show dice values in UI - show for both players
                const currentPlayer = window.b && window.b.getCurrentPlayer ? window.b.getCurrentPlayer() : 'Unknown';
                const playerName = currentPlayer === window.b.WHITE ? 'Player 1' : 'AI';
                diceValuesDisplay.style.display = 'block';
                diceValuesDisplay.textContent = playerName + ' rolled: ' + diceValues.join(', ');

                // Try to use 3D dice first
                if (dice1Loaded && dice2Loaded) {
                    dice3dContainer.style.display = 'flex';
                    cssDiceContainer.style.display = 'none';

                    // Show/hide extra dice for doubles
                    document.getElementById('dice3-canvas').style.display = diceValues.length > 2 ? 'block' : 'none';
                    document.getElementById('dice4-canvas').style.display = diceValues.length > 3 ? 'block' : 'none';

                    const delay = window.isAIRolling ? 0 : 1000;

                    setTimeout(() => {
                        // Update existing dice
                        if (diceValues[0]) {
                            const rotation1 = getDiceRotation(diceValues[0]);
                            if (!window.isAIRolling) {
                                animateDiceRoll(dice1Model, rotation1, 1000);
                            } else {
                                dice1Model.rotation.x = rotation1.x;
                                dice1Model.rotation.y = rotation1.y;
                                dice1Model.rotation.z = rotation1.z;
                            }
                        }

                        if (diceValues[1]) {
                            const rotation2 = getDiceRotation(diceValues[1]);
                            if (!window.isAIRolling) {
                                animateDiceRoll(dice2Model, rotation2, 1000);
                            } else {
                                dice2Model.rotation.x = rotation2.x;
                                dice2Model.rotation.y = rotation2.y;
                                dice2Model.rotation.z = rotation2.z;
                            }
                        }
                    }, delay);
                } else {
                    // Fallback to CSS dice
                    dice3dContainer.style.display = 'none';
                    cssDiceContainer.style.display = 'flex';

                    // Show/hide extra dice for doubles
                    document.getElementById('dice3').style.display = diceValues.length > 2 ? 'block' : 'none';
                    document.getElementById('dice4').style.display = diceValues.length > 3 ? 'block' : 'none';

                    const dice1 = document.getElementById('dice1');
                    const dice2 = document.getElementById('dice2');
                    const dice3 = document.getElementById('dice3');
                    const dice4 = document.getElementById('dice4');

                    dice1.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    dice2.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    if (dice3) dice3.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    if (dice4) dice4.style.transform = 'rotateX(0deg) rotateY(0deg)';

                    if (!window.isAIRolling) {
                        dice1.classList.add('rolling');
                        dice2.classList.add('rolling');
                        if (dice3) dice3.classList.add('rolling');
                        if (dice4) dice4.classList.add('rolling');
                    }

                    const delay = window.isAIRolling ? 0 : 1000;
                    setTimeout(() => {
                        dice1.classList.remove('rolling');
                        dice2.classList.remove('rolling');
                        if (dice3) dice3.classList.remove('rolling');
                        if (dice4) dice4.classList.remove('rolling');

                        const rotations = {
                            1: 'rotateX(90deg) rotateY(0deg)',
                            2: 'rotateX(0deg) rotateY(-90deg)',
                            3: 'rotateX(180deg) rotateY(0deg)',
                            4: 'rotateX(0deg) rotateY(0deg)',
                            5: 'rotateX(0deg) rotateY(90deg)',
                            6: 'rotateX(-90deg) rotateY(0deg)'
                        };

                        if (diceValues[0]) {
                            dice1.style.transform = rotations[diceValues[0]];
                        }
                        if (diceValues[1]) {
                            dice2.style.transform = rotations[diceValues[1]];
                        }
                        if (diceValues[2] && dice3) {
                            dice3.style.transform = rotations[diceValues[2]];
                        }
                        if (diceValues[3] && dice4) {
                            dice4.style.transform = rotations[diceValues[3]];
                        }
                    }, delay);
                }
            } else {
                dice3dContainer.style.display = 'none';
                cssDiceContainer.style.display = 'none';
                diceValuesDisplay.style.display = 'none';
            }
        }

        function handleDiceClick(diceIndex) {
            const remainingDices = window.b.getBoard().getRemainingDices();

            if (remainingDices.length === 0) return;

            // Toggle selection
            const index = selectedDice.indexOf(diceIndex);
            if (index > -1) {
                selectedDice.splice(index, 1);
            } else {
                selectedDice.push(diceIndex);
            }

            // Update visual selection
            updateDiceSelection();

            // If both dice are selected, end turn
            if (selectedDice.length === 2) {
                showHint('Ending turn...');
                setTimeout(() => {
                    if (window.b && window.b.swap) {
                        window.b.switchPlayer();
                    }
                    selectedDice = [];
                    updateDiceSelection();
                }, 500);
            }
        }

        function updateDiceSelection() {
            const dice1Canvas = document.getElementById('dice1-canvas');
            const dice2Canvas = document.getElementById('dice2-canvas');
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');

            // Update 3D dice selection
            if (dice1Canvas) {
                dice1Canvas.classList.toggle('selected', selectedDice.includes(0));
            }
            if (dice2Canvas) {
                dice2Canvas.classList.toggle('selected', selectedDice.includes(1));
            }

            // Update CSS dice selection
            if (dice1) {
                dice1.classList.toggle('selected', selectedDice.includes(0));
            }
            if (dice2) {
                dice2.classList.toggle('selected', selectedDice.includes(1));
            }
        }

        // Hook into the game to update dice display
        const originalThrowDice = window.b?.throwDice;
        if (originalThrowDice) {
            window.b.throwDice = function() {
                originalThrowDice.call(this);
                setTimeout(() => {
                    const remainingDices = this.getBoard().getRemainingDices();
                    update3DDice(remainingDices);
                }, 100);
            };
        }

        // Hook into state changes to hide dice when AI's turn
        if (window.b && window.b.registerStateListener) {
            window.b.registerStateListener(function() {
                if (window.b && window.b.getCurrentPlayer && window.b.getCurrentPlayer() === window.b.BLACK) {
                    update3DDice([]); // Hide dice during AI turn
                } else if (window.b && window.b.getCurrentPlayer && window.b.getCurrentPlayer() === window.b.WHITE) {
                    // Show dice when it's human's turn during MOVING state
                    if (window.b.getGameState && window.b.getGameState() === window.b.STATES.MOVING) {
                        const remainingDices = window.b.getBoard().getRemainingDices();
                        update3DDice(remainingDices);
                    }
                    // Show message during THROWING_DICE
                    if (window.b.getGameState && window.b.getGameState() === window.b.STATES.THROWING_DICE) {
                        showHint('🎲 Player 1 starts! Roll the dice to begin!');
                    }
                }
            });
        }

        // Make update3DDice globally available for the game
        window.update3DDice = update3DDice;

        // Make showHint globally available for the game
        window.showHint = showHint;

        // Make dice selection functions globally available
        window.handleDiceClick = handleDiceClick;
        window.updateDiceSelection = updateDiceSelection;

        // Initialize 3D dice
        document.addEventListener('DOMContentLoaded', () => {
            init3DDice();
            update3DDice([]);

            // Add click handlers for dice
            setTimeout(() => {
                const dice1Canvas = document.getElementById('dice1-canvas');
                const dice2Canvas = document.getElementById('dice2-canvas');
                const dice1 = document.getElementById('dice1');
                const dice2 = document.getElementById('dice2');

                if (dice1Canvas) {
                    dice1Canvas.addEventListener('click', () => handleDiceClick(0));
                }
                if (dice2Canvas) {
                    dice2Canvas.addEventListener('click', () => handleDiceClick(1));
                }
                if (dice1) {
                    dice1.addEventListener('click', () => handleDiceClick(0));
                }
                if (dice2) {
                    dice2.addEventListener('click', () => handleDiceClick(1));
                }
            }, 2000);

            // Show initial message
            setTimeout(() => {
                showHint('🎲 Player 1 starts! Roll the dice to begin!');
            }, 1000);
        });
    </script>
</body>
</html>
